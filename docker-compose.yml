version: '3.8'

services:
  bearhops:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DEBUG=true
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./src:/app/src
      - ./.env:/app/.env
    command: uvicorn src.bearhops.main:app --host 0.0.0.0 --port 8000 --reload
